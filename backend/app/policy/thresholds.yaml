# Policy thresholds. ILLUSTRATIVE DEFAULTS, not company rules:
# the task gives no evaluation rules, so these are explicit assumptions to tune with the VIP team.
# Change a number here and re-run analysis: no code or prompt changes needed.

sla:
  # A player is "waiting" when the last non-system message in the conversation is theirs.
  response_hours: 4          # waiting longer than this = SLA breach -> at least P1
  critical_wait_hours: 24    # money/verification request waiting longer than this -> P0
  channel_response_hours:    # per-channel override of response_hours
    email: 8
  at_risk_share: 0.75        # waiting past this share of the SLA = "at risk" on the team lead board

analysis:
  min_confidence: 0.5        # below this the AI result is flagged for human review

# Deterministic safety net. Runs on player messages even when the LLM is down or misses a signal.
# Lowercase substrings; matched against lowercased text.
safety:
  responsible_gaming:
    - самоисключ
    - заблокируйте меня
    - закрыть аккаунт
    - не могу остановиться
    - не могу перестать
    - зависимост
    - лудоман
    - проиграл все
    - проиграл всё
    - self-exclu
    - block my account
    - close my account
    - can't stop
    - cannot stop
    - gambling problem
    - addicted
  fraud_security:
    - это был не я
    - это не я
    - взлом
    - не я входил
    - украли
    - мошенни
    - hacked
    - "wasn't me"
    - was not me
    - unauthorized
    - stolen

# Signals from the player's profile (players.csv columns kept by the adapter). Missing columns
# give no signal. All of this is decided in code; the LLM never sees it.
player:
  restricted_statuses: [self_excluded, limit_set]  # no offers; self_excluded -> RG specialist
  failed_deposits_7d: 3          # this many failed deposits in 7 days = money problem
  pending_withdrawal_usd: 1000   # a payout this large is waiting = money problem
  deposit_drop_share: 0.5        # deposits fell below half of the previous 30 days = churn risk
  deposit_spike_ratio: 1.7       # deposits grew 1.7x or more = check for harm, human review

# Words that make a message a promotional offer. Offers are never suggested to players with a
# responsible-gaming signal, and a manager sending one is flagged as a quality issue.
offers:
  - бонус
  - фриспин
  - фри спин
  - кэшбэк
  - кешбек
  - промокод
  - отыграться
  - bonus
  - free spin
  - freespin
  - cashback
  - promo
  - reload
  - релоад
  # Pushing the player to play more by lifting a limit counts as an offer too.
  - limit can be raised
  - raise your limit
  - increase your limit
  - поднять лимит
  - повысить лимит
  - увеличить лимит
